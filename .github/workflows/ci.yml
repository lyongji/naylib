name: Nim CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: 'stable'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Update package list
      run: |
        sudo apt update
    - name: Install dependencies
      run: |
        sudo apt install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev libwayland-bin mingw-w64
    - name: Set up Emscripten
      run: |
        git clone https://github.com/emscripten-core/emsdk.git
        cd emsdk
        ./emsdk install latest
        ./emsdk activate latest
    - name: Run tests
      run: |
        source ${GITHUB_WORKSPACE}/emsdk/emsdk_env.sh
        nimble test -Y

  test-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: 'stable'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Emscripten
      uses: emscripten-core/setup-emsdk@v16
      with:
        version: latest
    - name: Debug Emscripten
      run: |
        Write-Host "EMSDK=$env:EMSDK"
        Write-Host "EMSDK_NODE=$env:EMSDK_NODE"
        Write-Host "EM_CONFIG=$env:EM_CONFIG"
        Get-ChildItem "$env:EMSDK" -Filter emcc.bat -Recurse -ErrorAction SilentlyContinue | Select-Object -First 3 FullName
        Write-Host "--- PATH entries with emsdk/emscripten ---"
        $env:PATH -split ';' | Where-Object { $_ -match 'emsdk|emscripten' }
        Write-Host "--- construct_env output ---"
        & "$env:EMSDK\emsdk.ps1" construct_env
        Write-Host "--- PATH after construct_env ---"
        $env:PATH -split ';' | Where-Object { $_ -match 'emsdk|emscripten' }
        Write-Host "--- Get-Command emcc.bat ---"
        (Get-Command emcc.bat -ErrorAction SilentlyContinue).Source
    - name: Run tests
      run: nimble test -Y

  test-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: 'stable'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Install dependencies
      run: |
        brew install emscripten
    - name: Run tests
      run: nimble test -Y
