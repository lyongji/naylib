name: Nim CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: 'stable'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Update package list
      run: |
        sudo apt update
    - name: Install dependencies
      run: |
        sudo apt install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev libwayland-bin mingw-w64
    - name: Set up Emscripten
      run: |
        git clone https://github.com/emscripten-core/emsdk.git
        cd emsdk
        ./emsdk install latest
        ./emsdk activate latest
    - name: Run tests
      run: |
        source ${GITHUB_WORKSPACE}/emsdk/emsdk_env.sh
        nimble test -Y

  test-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: 'stable'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Emscripten
      uses: emscripten-core/setup-emsdk@v16
      with:
        version: latest
    - name: Run tests
      run: |
        # 新版 emscripten 不再随包提供 emcc.bat（上游 #26247），
        # 而 tests/basic_window_web.nims 在 Windows 上按名字调用它，需自行补上
        $em = "$env:EMSDK\upstream\emscripten"
        if (-not (Test-Path "$em\emcc.bat")) {
          $py = if ($env:EMSDK_PYTHON) { $env:EMSDK_PYTHON } else { "python" }
          Set-Content -Path "$em\emcc.bat" -Value "@`"$py`" `"$em\emcc.py`" %*"
        }
        nimble test -Y

  test-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: 'stable'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Install dependencies
      run: |
        brew install emscripten
    - name: Run tests
      run: nimble test -Y
